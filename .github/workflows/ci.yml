name: Publish Packages

on:
  release:
    types: [created]
  workflow_dispatch: # Allows manual triggering

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for committing and pushing updates back to main

    outputs:
      version: ${{ steps.set_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check formatting and types
        run: vp check

      - name: Run tests
        run: vp test

      - name: Sync Version
        if: github.event_name == 'release'
        id: set_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Setting version to $VERSION"

          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json')); pkg.version = '$VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          node -e "const fs = require('fs'); const jsr = JSON.parse(fs.readFileSync('jsr.json')); jsr.version = '$VERSION'; fs.writeFileSync('jsr.json', JSON.stringify(jsr, null, 2) + '\n');"

          vp check --fix package.json jsr.json || true

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit Version Bump
        if: github.event_name == 'release'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json jsr.json
          git commit --no-verify -m "chore: release v$VERSION [skip ci]" || true
          git push origin main
          git tag -f $GITHUB_REF_NAME
          git push origin $GITHUB_REF_NAME -f

  publish-npm:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Sync version
        if: github.event_name == 'release'
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json')); pkg.version = '${{ needs.prepare.outputs.version }}'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Build project
        run: vp pack

      - name: Publish to npm
        run: npm publish --access public --provenance

  publish-jsr:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Sync version
        if: github.event_name == 'release'
        run: |
          node -e "const fs = require('fs'); const jsr = JSON.parse(fs.readFileSync('jsr.json')); jsr.version = '${{ needs.prepare.outputs.version }}'; fs.writeFileSync('jsr.json', JSON.stringify(jsr, null, 2) + '\n');"

      - name: Build project
        run: vp pack

      - name: Publish to JSR
        run: npx jsr publish
