name: Update Benchmarks

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Resolve baseline tag
        id: resolve-tag
        run: |
          CURRENT_VERSION="v$(jq -r .version package.json)"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "$CURRENT_VERSION" | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="v0.6.1"
          fi
          echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Cache baseline benchmarks
        id: cache-baseline
        uses: actions/cache@v4
        with:
          path: bench_baseline.txt
          key: benchmarks-baseline-${{ steps.resolve-tag.outputs.PREV_TAG }}

      - name: Run baseline benchmarks
        if: steps.cache-baseline.outputs.cache-hit != 'true'
        run: |
          git checkout ${{ steps.resolve-tag.outputs.PREV_TAG }}
          vp install
          npx vitest bench > bench_baseline.txt
          git checkout -

      - name: Run current benchmarks
        run: |
          vp install
          npx vitest bench > bench_main.txt

      - name: Update README with results
        run: node scripts/update-benchmarks.mjs

      - name: Clean up temporary benchmark logs
        run: rm -f bench_main.txt

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git add README.md
            git commit --no-verify -m "chore: update benchmark results [skip ci]"
            git push
          else
            echo "No changes to README.md — skipping commit."
          fi
